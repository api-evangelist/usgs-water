- aid: usgs-water:groundwater-levels
  name: USGS Groundwater Levels Service
  description: Provides historical manually-recorded groundwater level measurements from USGS wells and monitoring
    sites. Returns depth-to-water and water-level-above-datum values in JSON or RDB format. For automated real-time
    groundwater data, the Instantaneous Values Service should be used.
