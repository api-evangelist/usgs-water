apis:
- aid: usgs-water:instantaneous-values
  name: USGS Instantaneous Values Service
  description: Provides near real-time water data — streamflow, gage height, temperature, specific conductance,
    and hundreds of other parameters — from thousands of USGS monitoring sites. Values are typically recorded every
    15 minutes and transmitted hourly. Data is available from October 1, 2007 onwards and is marked provisional
    until reviewed.
  humanURL: https://waterservices.usgs.gov/docs/instantaneous-values/instantaneous-values-details/
  baseURL: https://waterservices.usgs.gov/nwis/iv/
  tags:
  - Real-Time
  - Streamflow
  - Gage Height
  - Water Parameters
  - Time Series
  properties:
  - type: Documentation
    url: https://waterservices.usgs.gov/docs/instantaneous-values/instantaneous-values-details/
  - type: Website
    url: https://waterservices.usgs.gov/
- aid: usgs-water:daily-values
  name: USGS Daily Values Service
  description: Returns historical summarized daily hydrologic data (mean, median, maximum, minimum) for streams,
    lakes, estuaries, and wells. Many sites have more than 10 years of record. Supports WaterML 1.1, WaterML 2.0,
    RDB (tab-delimited), and JSON output formats.
  humanURL: https://waterservices.usgs.gov/docs/dv-service/daily-values-service-details/
  baseURL: https://waterservices.usgs.gov/nwis/dv/
  tags:
  - Daily Values
  - Historical Data
  - Streamflow
  - Hydrology
  - WaterML
  properties:
