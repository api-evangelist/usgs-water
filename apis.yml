- aid: usgs-water:usgs-water-altitude-datums-api
  name: USGS Water Services altitude-datums API
  description: The recommended vertical datum is NAVD88 (North American Vertical Datum of 1988) where applicable
    as stated in Office of Information Technical Memo 2002.01. NGVD29 (National Geodetic Vertical Datum of 1929)
    and NAVD88 are the only datums that can be converted on output. NWIS uses the North American Vertical Datum
    Conversions (VERTCON) of the National Geodetic Survey to convert from NGVD29 to NAVD88 or vice versa. Conversions
    to or from other vertical datums are not available.
  humanURL: https://waterservices.usgs.gov/docs/instantaneous-values/instantaneous-values-details/
