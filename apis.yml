aid: usgs-water
name: USGS Water Services
description: The U.S. Geological Survey (USGS) National Water Information System (NWIS) exposes a suite of REST
  APIs providing access to real-time and historical water data from over 1.5 million monitoring locations across
  the United States and territories. The legacy WaterServices APIs (being decommissioned in early 2027) and the
  next-generation api.waterdata.usgs.gov OGC-compliant APIs together cover streamflow, groundwater levels, water
  quality, site metadata, and statistical summaries. All services are free, publicly funded, and require no authentication
  for standard use; API keys are available at no cost for higher rate-limit access.
