- aid: usgs-water:statistics-service
  name: USGS Statistics Service
  description: Retrieves daily, monthly, or annual statistics (mean, minimum, maximum, median, and percentiles P05–P95)
    computed from approved historical time-series data. Supports up to 10 sites per request and returns data in
    RDB tab-delimited format.
  humanURL: https://waterservices.usgs.gov/docs/statistics/statistics-details/
  baseURL: https://waterservices.usgs.gov/nwis/stats/
