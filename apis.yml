  - type: Website
    url: https://waterservices.usgs.gov/
- aid: usgs-water:site-service
  name: USGS Site Service
  description: Searches and retrieves metadata for millions of USGS hydrologic data collection sites including streams,
    springs, wells, lakes, reservoirs, estuaries, and glaciers. Filtering options include site number, state, HUC,
    bounding box, county, site type, and parameter codes. Outputs include tab-delimited, KML, and GeoJSON.
  humanURL: https://waterservices.usgs.gov/docs/site-service/site-service-details/
  baseURL: https://waterservices.usgs.gov/nwis/site/
  tags:
  - Site Metadata
  - Monitoring Locations
  - Geospatial
  - NWIS
  properties:
  - type: Documentation
