- aid: usgs-water:usgs-water-continuous-api
  name: USGS Water Services continuous API
  description: Continuous data are collected via automated sensors installed at a monitoring location. They are
    collected at a high frequency and often at a fixed 15-minute interval. Depending on the specific monitoring
    location, the data may be transmitted automatically via telemetry and be available on WDFN within minutes of
    collection, while other times the delivery of data may be delayed if the monitoring location does not have the
    capacity to automatically transmit data. Continuous data are described by parameter name and parameter code
    (pcode). These data might also be referred to as "instantaneous values" or "IV".
  humanURL: https://waterservices.usgs.gov/docs/instantaneous-values/instantaneous-values-details/
  baseURL: https://waterservices.usgs.gov/nwis/iv/
