  name: USGS Water Services time-series-metadata API
  description: Daily data and continuous measurements are grouped into time series, which represent a collection
    of observations of a single parameter, potentially aggregated using a standard statistic, at a single monitoring
    location. This endpoint provides metadata about those time series, including their operational thresholds, units
    of measurement, and when the earliest and most recent observations in a time series occurred.
