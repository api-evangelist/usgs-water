- aid: usgs-water:water-quality-portal
  name: Water Quality Portal (WQP) API
  description: A cooperative service sponsored by USGS and EPA providing access to water quality data from over
    400 agencies including USGS NWIS and EPA WQX. Endpoints cover monitoring sites, chemistry results, biological
    metrics, activity data, and detection limits. Supports spatial, temporal, characteristic, and organizational
    filters. Output formats include CSV, TSV, XLSX, XML, GeoJSON, KML, and KMZ.
